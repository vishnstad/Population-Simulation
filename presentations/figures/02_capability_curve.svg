<svg viewBox="0 0 620 240" width="100%" height="auto" role="img" aria-label="Capability curve — improvement on B0a, all scored targets" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;max-width:620px;font-family:inherit"><style>
