[project]
name = "popsim"
version = "0.1.0"
description = "B17 - hierarchical multi-agent population simulation: calibrated distribution-valued cluster agents"
readme = "README.md"
requires-python = ">=3.11"

# Pins are the VERIFIED WORKING set from B17_build_checklist.md step 0.3.
# Do not float these without re-running Gate 0 and Gate 1.
dependencies = [
    "pyreadstat==1.3.6",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "pyarrow==25.0.1",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "jinja2==3.0.3",
    "pyyaml==6.0.3",
    "streamlit==1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
pdf = [
    "pdfplumber>=0.11",
]

[project.scripts]
popsim = "popsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["popsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "layer0: Layer 0 gate - pipeline reproduces published reality",
    "layer1: Layer 1 gate - ground truth is trustworthy (SNR)",
    "slow: reads large microdata files",
]

[tool.ruff]
line-length = 100
target-version = "py311"
